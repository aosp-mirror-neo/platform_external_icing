syntax = "proto2";

package appsearch.lib;

option java_package = "com.google.android.appsearch.proto";
option java_multiple_files = true;
option objc_class_prefix = "APSC";

// Defines proto contains visibility overlay settings.
// Next tag: 4
message AndroidVOverlayProto {
  // OPTIONAL: the standard visibility settings. Caller could have access if
  // they match ANY of the requirements in this VisibilityConfig.
  optional VisibilityConfigProto visibility_config = 1;

  // OPTIONAL: The set of VisibilityConfig that have access. Caller could have
  // access only if they match ALL of the requirements in a VisibilityConfig.
  repeated VisibilityConfigProto visible_to_configs = 2;

  // OPTIONAL: the operating system UID of the package that owns/wrote this
  // schema.
  //
  // Default value is -1, which is the value for android.os.Process.INVALID_UID.
  optional int32 writer_uid = 3 [default = -1];
}

// Defines proto contains all required requirements of a nested
// VisibilityConfig. The requirements in a VisibleToConfigProto is "AND"
// relationship. A caller must match ALL requirements to access the schema. For
// example, a caller must hold required permissions AND it is a specified
// package.
//
// Placeholder packages: a reader that predates a field ignores it. When the
// field narrows access, i.e. a caller has to match it in addition to the other
// requirements, such a reader is left with the other requirements only, and
// grants access to more callers than the writer intended. A writer that sets
// such a field in one of AndroidVOverlayProto.visible_to_configs must therefore
// also add a placeholder package to visible_to_packages of the same config: a
// PackageIdentifierProto whose package_name cannot be the name of a real
// package. A reader that predates the field then requires the caller to be the
// placeholder package, so it grants access to no one through the config.
//
// Every field that narrows access has a placeholder of its own. A reader
// removes the placeholders of the fields it knows before it uses a config, and
// never returns them to callers. It does not remove any other placeholder: a
// placeholder it does not know is treated as a real package, and matches no
// caller.
//
// A reader that predates a field returns its placeholder to callers as a
// package, and a caller can set it back, which stores the placeholder without
// the field. A reader that knows the placeholder must skip such a config if the
// placeholder is its only package, since the config would otherwise be left
// with the other requirements only.
//
// Placeholder package names in use:
//   "VS#PackagesWithTags" for visible_to_packages_with_tags.
// Next tag: 6
message VisibilityConfigProto {
  // OPTIONAL: whether this schema could be visible to the platform.
  optional bool not_platform_surfaceable = 1;

  // OPTIONAL: the package identifiers of the while list packages that have
  // access to this schema. May also hold placeholder packages, see the comment
  // of this message.
  repeated PackageIdentifierProto visible_to_packages = 2;

  // OPTIONAL: the required permission combinations that the caller need to
  // hold.
  repeated VisibleToPermissionProto visible_to_permissions = 3;

  // OPTIONAL: the package identifier of the target package for public
  // visibility.
  optional PackageIdentifierProto publicly_visible_target_package = 4;

  // OPTIONAL: the package identifiers paired with required attribution tags
  // that have access to this schema. Only set in
  // AndroidVOverlayProto.visible_to_configs. This field narrows access, so a
  // config that sets it also has the "VS#PackagesWithTags" placeholder package
  // in visible_to_packages, see the comment of this message.
  repeated VisibleToPackageWithTagsProto visible_to_packages_with_tags = 5;
}

// Defines a proto to represent a PackageIdentifier.
// Either package_sha256cert or package_sha256_certs should be set.
// Next tag: 4
message PackageIdentifierProto {
  // REQUIRED: the package name of the given PackageIdentifier
  optional string package_name = 1;

  // OPTIONAL: the sha 256 cert for single-signer packages
  optional bytes package_sha256cert = 2;

  // OPTIONAL: all SHA-256 certs for multi-signer packages
  repeated bytes package_sha256_certs = 3;
}

// Defines a proto to represent a set of required Android permission
// combination. Next tag: 2
message VisibleToPermissionProto {
  // REQUIRED: the required permissions that the caller need to hold to get
  // access.
  repeated uint32 permissions = 1 [packed = true];
}

// Defines a proto to represent a PackageIdentifier paired with required
// attribution tags. A caller from the package matches this entry only if it
// presents one of the tags.
//
// A config has either packages (visible_to_packages) or packages paired with
// attribution tags (visible_to_packages_with_tags), not both. The placeholder
// package described in VisibilityConfigProto does not count as a package here.
// A config that has both is invalid, and readers skip it.
// Next tag: 3
message VisibleToPackageWithTagsProto {
  // REQUIRED: the package identifier that is granted access when presenting a
  // matching attribution tag.
  optional PackageIdentifierProto package_identifier = 1;

  // REQUIRED: the allowed attribution tags for this package. A caller from
  // package_identifier must carry one of these tags to get access.
  repeated string attribution_tags = 2;
}
